name: Build MEU RUMO APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Descompactar projeto
        run: |
          mkdir projeto
          unzip -q MeuRumo_GitHub_APK_CORRIGIDO.zip -d projeto
          cd projeto
          ls -la

      - name: Compilar APK
        working-directory: projeto
        run: gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuRumo-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
